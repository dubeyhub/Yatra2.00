{% extends 'base.html' %}

{% block title %}Pilgrim Registration - Yatra{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 40px auto; background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 28px;">
        <div class="brand-icon" style="margin: 0 auto 12px auto;">
            <i class="fa-solid fa-hands-praying"></i>
        </div>
        <h2 style="font-size: 1.8rem; color: var(--secondary-color);">Create Pilgrim Account</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Join Yatra for personalized global sacred spiritual journeys</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
        <div style="margin-bottom: 16px;">
            <label for="full_name" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px;">Full Name *</label>
            <input type="text" name="full_name" id="full_name" required placeholder="e.g. Ramesh & Priya Patel" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem;">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="username" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px;">Username *</label>
            <input type="text" name="username" id="username" required placeholder="ramesh_patel" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem;">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="email" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px;">Email Address *</label>
            <input type="email" name="email" id="email" required placeholder="ramesh@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem;">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="phone" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px;">Mobile / WhatsApp Number</label>
            <input type="tel" name="phone" id="phone" placeholder="+91 98765 43210" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem;">
        </div>

        <div style="margin-bottom: 24px;">
            <label for="password" style="display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 6px;">Password *</label>
            <input type="password" name="password" id="password" required placeholder="Create a secure password" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 1rem;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1.05rem;">
            Create Account & Begin
        </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 0.92rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Sign In</a>
    </div>
</div>
{% endblock %}
